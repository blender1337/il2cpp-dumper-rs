[package]
name = "il2cpp-dumper-rs"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Fast, cross-platform static Unity IL2CPP metadata & binary dumper in Rust (v16-v39 + adaptive layouts, PE/ELF/Mach-O/NSO/WASM, APK/XAPK/IPA, GUI & Diff)"
repository = "https://github.com/blender1337/il2cpp-dumper-rs"
keywords = ["il2cpp", "unity", "reverse-engineering", "dumper", "binary-analysis"]
categories = ["command-line-utilities", "development-tools::debugging"]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = "0.31"
goblin = "0.9"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
